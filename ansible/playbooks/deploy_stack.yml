---
- name: Deploy Docker stack from Controller to Swarm Manager
  hosts: manager
  become: yes
  vars:
    deploy_path: /home/ubuntu/DevOps_Assignment12/docker
    stack_name: devops_stack

  tasks:
    - name: Ensure deployment directory exists on manager
      file:
        path: "{{ deploy_path }}"
        state: directory
        mode: '0755'

    - name: Copy Docker Compose file to manager
      copy:
        src: "{{ playbook_dir }}/../../docker/docker-compose.yml"
        dest: "{{ deploy_path }}/docker-compose.yml"
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: Copy Django app folder to manager
      synchronize:
        src: "{{ playbook_dir }}/../../django_app/"
        dest: "{{ deploy_path }}/django_app/"
        recursive: yes
        rsync_opts:
          - "--chmod=Du=rwx,Dg=rx,Do=rx,Fu=rw,Fg=r,Fo=r"
        private_key: /home/ubuntu/DevOps_Assignment12/terraform/terraform-key.pem

    - name: Deploy the Docker stack using Docker Compose v2
      community.docker.docker_compose_v2:
        project_src: "{{ deploy_path }}"
        state: present
        recreate: always    # if you want to force recreation of containers
        remove_orphans: yes
        build: always
